name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `sh ./mvnw` rather than `./mvnw`: a copy made on Windows loses the executable bit.
      - name: Build and test
        run: sh ./mvnw -B verify
